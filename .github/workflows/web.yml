name: Deploy Saturn Explorer (Web)

# Builds the Emscripten/WebGL frontend and publishes it to GitHub Pages.
on:
  push:
    branches: [master]
    paths:
      - 'SaturnExplorer/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Configure (emcmake)
        working-directory: SaturnExplorer
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: SaturnExplorer
        run: cmake --build build-web -j

      - name: Verify artifacts
        working-directory: SaturnExplorer
        run: |
          ls -la build-web/bin
          test -f build-web/bin/index.html
          test -f build-web/bin/index.wasm

      - name: Add hardware guides
        working-directory: SaturnExplorer
        run: |
          mkdir -p build-web/bin/guides
          cp web/guides/*.html build-web/bin/guides/
          ls -la build-web/bin/guides

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: SaturnExplorer/build-web/bin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
