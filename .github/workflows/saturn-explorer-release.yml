name: Saturn Explorer Release

# Builds the downloadable archives: Saturn Explorer plus the patched Mednafen it launches, laid out by
# SaturnExplorer/Integration/package_release.py (and with the GPL source offer + patched-source tarball
# from make_source_offer.py). A v* tag creates a DRAFT release for a person to review, sign and publish;
# a manual run only uploads the archives as workflow artifacts.
#
# macOS signing: the macOS job builds an ad hoc signed archive. The separate "macos-sign" job (tags, or a
# manual run with sign=true) re-signs it with a Developer ID, has Apple notarise it and staples the ticket,
# using secrets from the repository's "release" environment (see SaturnExplorer/Integration/DISTRIBUTION.md,
# "Signing in CI"). Without those secrets it does nothing and the ad hoc archive is what gets attached.
# Windows code signing is not done.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      label:
        description: 'Release label used in the archive names (default: the short commit)'
        required: false
      sign:
        description: 'Also sign and notarise the macOS archive (needs the release environment secrets)'
        type: boolean
        default: false

# Build jobs only read the repository; the one job that creates the release asks for write access itself.
permissions:
  contents: read

jobs:
  macos:
    name: macOS archive
    runs-on: macos-latest
    env:
      # The tag being built, baked into the app (cmake/GenerateBuildInfo.cmake) so "Check for Updates"
      # can compare it with the latest GitHub release. Empty for a manual run, which is not a release.
      SE_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    defaults:
      run:
        working-directory: SaturnExplorer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: brew install sdl2 flac gettext autoconf automake libtool pkg-config

      # The label comes from a typed input or a tag name, so it reaches the shell only through the
      # environment and only after it matches a filename-safe pattern.
      - name: Label
        id: label
        shell: bash
        env:
          INPUT_LABEL: ${{ github.event.inputs.label }}
        run: |
          LABEL="$INPUT_LABEL"
          [ -z "$LABEL" ] && [ "$GITHUB_REF_TYPE" = "tag" ] && LABEL="$GITHUB_REF_NAME"
          [ -z "$LABEL" ] && LABEL="$(git rev-parse --short=10 HEAD)"
          if ! printf '%s' "$LABEL" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "release label must contain only letters, digits, '.', '_' and '-'" >&2
            exit 1
          fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      # Pinned to the commit in Integration/Mednafen/UPSTREAM.json; Saturn core only.
      - name: Build the patched Mednafen
        run: python3 Integration/install.py --yes --no-se --mednafen-saturn-only

      - name: Build the self-contained app
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DSE_MACOS_BUNDLE_LIBS=ON -DSE_DEMO_MENU=OFF
          cmake --build build-release --parallel 4
          cmake --install build-release --prefix "$PWD/stage"

      # A tag build must have its tag baked into the app, or "Check for Updates" in the shipped build would call
      # itself "not a tagged release". Fail here rather than ship that.
      - name: Check the Demo menu is off
        run: grep -q "^SE_DEMO_MENU:BOOL=OFF" build-release/CMakeCache.txt

      - name: Check the release version is baked in
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          grep -F "kBuildVersion = \"$GITHUB_REF_NAME\"" build-release/generated/BuildInfo.h || {
            echo "build-release/generated/BuildInfo.h does not carry $GITHUB_REF_NAME:"; grep kBuildVersion build-release/generated/BuildInfo.h; exit 1
          }

      - name: Package
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          python3 Integration/package_release.py --se-app stage/SaturnExplorer.app \
            --mednafen _emu/mednafen/src/mednafen --ref "$LABEL" --out dist

      # Published beside the archive so a download can be checked against what this run built.
      - name: Checksum
        run: cd dist && shasum -a 256 *.dmg > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            SaturnExplorer/dist/*.dmg
            SaturnExplorer/dist/SHA256SUMS-macos.txt
          if-no-files-found: error

  windows:
    name: Windows archive
    runs-on: windows-latest
    env:
      # The tag being built, baked into the app (cmake/GenerateBuildInfo.cmake) so "Check for Updates"
      # can compare it with the latest GitHub release. Empty for a manual run, which is not a release.
      SE_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    defaults:
      run:
        working-directory: SaturnExplorer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The label comes from a typed input or a tag name, so it reaches the shell only through the
      # environment and only after it matches a filename-safe pattern.
      - name: Label
        id: label
        shell: bash
        env:
          INPUT_LABEL: ${{ github.event.inputs.label }}
        run: |
          LABEL="$INPUT_LABEL"
          [ -z "$LABEL" ] && [ "$GITHUB_REF_TYPE" = "tag" ] && LABEL="$GITHUB_REF_NAME"
          [ -z "$LABEL" ] && LABEL="$(git rev-parse --short=10 HEAD)"
          if ! printf '%s' "$LABEL" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "release label must contain only letters, digits, '.', '_' and '-'" >&2
            exit 1
          fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      # Builds Saturn Explorer (Release, with its licenses\ folder) and, through MSYS2, the patched
      # Mednafen at the commit pinned in Integration/Mednafen/UPSTREAM.json.
      - name: Build Saturn Explorer and the patched Mednafen
        run: python Integration\install.py --yes --mednafen-saturn-only --no-demo-menu

      # A tag build must have its tag baked into the app, or "Check for Updates" in the shipped build would call
      # itself "not a tagged release". Fail here rather than ship that.
      - name: Check the Demo menu is off
        shell: bash
        run: grep -q "^SE_DEMO_MENU:BOOL=OFF" build/CMakeCache.txt

      - name: Check the release version is baked in
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          grep -F "kBuildVersion = \"$GITHUB_REF_NAME\"" build/generated/BuildInfo.h || {
            echo "build/generated/BuildInfo.h does not carry $GITHUB_REF_NAME:"; grep kBuildVersion build/generated/BuildInfo.h; exit 1
          }

      - name: Package
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: >
          python Integration\package_release.py --se-app build\bin\Release --mednafen _emu\mednafen
          --ref "$env:LABEL" --out dist

      # Published beside the archive so a download can be checked against what this run built.
      - name: Checksum
        shell: bash
        run: cd dist && sha256sum *.zip > SHA256SUMS-windows.txt && cat SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            SaturnExplorer/dist/*.zip
            SaturnExplorer/dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  macos-sign:
    name: macOS Developer ID signing and notarization
    if: github.ref_type == 'tag' || github.event.inputs.sign == 'true'
    needs: macos
    runs-on: macos-latest
    # Secrets live in this environment, which can require a reviewer's approval before the job may use them.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: unsigned

      # Everything below runs only when the credentials were supplied; the values reach the shell only
      # through the environment.
      - name: Check for signing credentials
        id: creds
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ok=false
          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
            if { [ -n "$KEY_P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ]; } || \
               { [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$APP_PASSWORD" ]; }; then ok=true; fi
          fi
          echo "enabled=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != true ]; then
            echo "::warning::Signing secrets are not configured in the 'release' environment; the macOS archive stays ad hoc signed."
          fi

      - name: Import the signing certificate
        if: steps.creds.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # The Developer ID intermediate certificate, so the identity validates as a chain.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" > /dev/null || true
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign, notarize and staple
        if: steps.creds.outputs.enabled == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          DMG="$(ls unsigned/*.dmg)"
          python3 SaturnExplorer/Integration/notarize_release.py --dmg "$DMG" --out "signed/$(basename "$DMG")"

      # The archive CI built was checksummed before it was re-signed; this is a different file, so it gets its own.
      - name: Checksum
        if: steps.creds.outputs.enabled == 'true'
        run: cd signed && shasum -a 256 *.dmg > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.enabled == 'true'
        with:
          name: macos-notarized
          path: |
            signed/*.dmg
            signed/SHA256SUMS-macos.txt
          if-no-files-found: error

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  draft-release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [macos, windows, macos-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(archives/windows/*)
          notes="Includes mednafen-se, a modified Mednafen build (not an official release); its source is in each archive (SOURCE.txt and mednafen-se-source.tar.xz). You supply the Saturn BIOS. The Windows zip is not code-signed, so SmartScreen may warn the first time you run it (More info, then Run anyway). Check a download against the SHA256SUMS-windows.txt / SHA256SUMS-macos.txt attached here."
          if ls archives/macos-notarized/*.dmg > /dev/null 2>&1; then
            files+=(archives/macos-notarized/*)
          else
            files+=(archives/macos/*)
            notes="$notes The macOS archive is NOT notarized (ad hoc signed): open it with right-click, Open."
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Saturn Explorer $GITHUB_REF_NAME" --generate-notes --notes "$notes" \
            "${files[@]}"
