name: Saturn Explorer Functionality Verification

on:
  push:
    branches: [master]
    paths:
      - 'SaturnExplorer/**'
      - 'RomHackingTools.sln'
      - '.github/workflows/saturn-explorer-verify.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [master]
    paths:
      - 'SaturnExplorer/**'
      - 'RomHackingTools.sln'
      - '.github/workflows/saturn-explorer-verify.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# The gates each job proves are listed in SaturnExplorer/Docs/Decompiler/PLAN.md, contract A7.
# Builds use --parallel 4: a bare --parallel gives the Makefile generator (macOS) an unbounded
# make -j, which swaps the 3-core runners on the decompiler engine's large units.
jobs:
  native:
    name: Supported platform build + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Explicit (A12-37): the default is 360 minutes. Windows Debug took 157 minutes with the decompiler tests run twice (A12-36).
    timeout-minutes: 240
    env:
      # The tests whose own output the verification record copies (A7). The full run excludes them (-E) and the step after it
      # runs them with -V (-R), so each test runs once; a test outside this list, a new one included, is in the full run (A12-36).
      SE_DECOMPILER_TESTS: SaturnExplorer(SlaFreshness|Sh2DecompilerEngine|MemorySnapshot|Sh2FunctionFinder|Sh2Decompiler|Sh2Semantics|Sh2Decode|Sh2Generated|Sh2DecompilerFixture|DecompilerRunner|DecompilerPanel)Tests
    defaults:
      run:
        working-directory: SaturnExplorer
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS frontend dependencies
        if: runner.os == 'macOS'
        run: brew install sdl2

      # patchelf: check_package_release.py relinks a library the way a Linux release does.
      - name: Install Linux frontend dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl-dev libcurl4-openssl-dev patchelf

      # SE_FAIL_ON_SKIP: a test that exits 77 (the game save states missing, no C compiler) is a failure here, not a "Skipped"
      # that ctest still counts as passed (A12-52).
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSE_FAIL_ON_SKIP=ON

      # Built on its own first only so its build time is visible in the log (A7 "Timing").
      - name: Build decompiler engine (timed)
        shell: bash
        run: time cmake --build build --config Debug --parallel 4 --target SaturnExplorerGhidraDecomp

      - name: Build
        run: cmake --build build --config Debug --parallel 4

      # A silent drop of registered tests (a CMake condition that stops holding, a missing Python) must not leave the job green
      # on fewer tests (A12-37). The floors are below the counts of 2026-11-19 (Windows 95, macOS 110).
      - name: Check the registered test count
        shell: bash
        run: bash ../.github/scripts/check-test-count.sh build ${{ runner.os == 'Windows' && '90' || '105' }} -- -C Debug

      # The two -R steps below end green on a partial selection (--no-tests=error fails only when nothing matches), so each
      # selection is counted first: SE_DECOMPILER_TESTS names 11 tests, the Windows Release step 3 (A12-56).
      - name: Check the decompiler suites are all registered
        shell: bash
        run: |
          bash ../.github/scripts/check-selected-count.sh build "${{ env.SE_DECOMPILER_TESTS }}" 11 -- -C Debug
          if [ "${{ runner.os }}" = Windows ]; then
            bash ../.github/scripts/check-selected-count.sh build "SaturnExplorer(DecompilerRunner|Sh2Decompiler|DecompilerPanel)Tests" 3 -- -C Release
          fi

      # The runner's default shell, not bash (A12-45): under Git Bash on Windows, SaturnExplorerSh2DecompilerEngineTests'
      # icacls deny-write ACE was not enforced (TestUnwritableConfigDir, PR #68 run 44640816333), where it is under the default
      # shell. The regex comes in as an expression so the line reads the same in pwsh and bash.
      - name: Run CTest (all but the decompiler suites, which run once in the next step)
        run: ctest --test-dir build -C Debug --output-on-failure -E "${{ env.SE_DECOMPILER_TESTS }}"

      # Passing tests print nothing above; the decompiler tests' own output (timings, the
      # decompiled fixture) is what the verification record copies (A7), so show it. They ran in the
      # step above as well before A12-36: seventy minutes twice on Windows Debug. This step also runs
      # after a failure of the one above, so a run reports both.
      - name: Decompiler tests, with their output
        if: ${{ !cancelled() }}
        run: ctest --test-dir build -C Debug -V --no-tests=error -R "${{ env.SE_DECOMPILER_TESTS }}"

      # The Debug runner test above uses a tenth of each cancellation fixture on Windows (the Debug
      # CRT's checked iterators make the engine ~20x slower there), and the allocation-failure cases
      # skip themselves there (its STL allocates inside noexcept moves); Release runs both in full.
      - name: Decompiler tests in Release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4 --target SaturnExplorerDecompilerRunnerTests SaturnExplorerSh2DecompilerTests SaturnExplorerDecompilerPanelTests
          ctest --test-dir build -C Release -V --no-tests=error -R "SaturnExplorer(DecompilerRunner|Sh2Decompiler|DecompilerPanel)Tests"

      - name: Verify macOS headless renderer and frontend exist
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -x build/bin/se-render
          # The frontend target's OUTPUT_NAME, not its CMake target name.
          test -d build/bin/SaturnExplorer.app
          test -x build/bin/SaturnExplorer.app/Contents/MacOS/SaturnExplorer

      # The Linux frontend, its licence texts, and that libcurl is loaded at run time rather than linked
      # (a release must not carry the build machine's libcurl; see LoadCurl in WebPlatform.cpp).
      - name: Verify Linux headless renderer and frontend exist
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x build/bin/se-render
          test -x build/bin/SaturnExplorerFrontEnd
          test -d build/bin/licenses
          ! readelf -d build/bin/SaturnExplorerFrontEnd | grep -q libcurl
          SDL_VIDEODRIVER=dummy build/bin/SaturnExplorerFrontEnd --selftest

  # build-release.bat: the documented CMake + VS 2022 Release build.
  windows-release-batch:
    name: build-release.bat (Windows, CMake Release)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: SaturnExplorer
    steps:
      - uses: actions/checkout@v4
      - name: Run build-release.bat
        shell: cmd
        run: call build-release.bat
      - name: Verify the exe and its licence files exist
        shell: bash
        run: |
          test -f build/bin/Release/SaturnExplorerFrontEnd.exe
          # The set the About dialog's "Third-party" list names.
          for f in ghidra-decompiler/LICENSE ghidra-decompiler/NOTICE zlib/LICENSE nlohmann-json/LICENSE.MIT imgui/LICENSE.txt fonts/LICENSE-IPAfont.txt fonts/LICENSE-Liberation.txt; do
            test -f "build/bin/Release/licenses/$f"
          done

  # build-release-msbuild.bat: the checked-in solution, no CMake. This is what proves the
  # hand-written .vcxproj wiring (zlib into the savestate driver, the decompiler projects) builds.
  # Run twice: once with the toolset the script picks for the runner's VS 2022 (v143), and once
  # forced to v142, the toolset a VS 2019 machine gets -- so both supported Visual Studios build.
  windows-msbuild-batch:
    name: build-release-msbuild.bat (Windows, checked-in solution, ${{ matrix.toolset || 'auto' }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolset: ['', 'v142']
    env:
      SE_TOOLSET: ${{ matrix.toolset }}
    defaults:
      run:
        working-directory: SaturnExplorer
    steps:
      - uses: actions/checkout@v4
      - name: Run build-release-msbuild.bat
        shell: cmd
        run: call build-release-msbuild.bat
      - name: Verify the exe and its licence files exist
        shell: bash
        run: |
          test -f ../x64/Release/SaturnExplorer.exe
          # The solution stamps the commit (About, update check) as the CMake build does.
          grep -a -q "${GITHUB_SHA:0:10}" ../x64/Release/SaturnExplorer.exe
          # The set the About dialog's "Third-party" list names.
          for f in ghidra-decompiler/LICENSE ghidra-decompiler/NOTICE zlib/LICENSE nlohmann-json/LICENSE.MIT imgui/LICENSE.txt fonts/LICENSE-IPAfont.txt fonts/LICENSE-Liberation.txt; do
            test -f "../x64/Release/licenses/$f"
          done

  # No Intel macOS runner: the engine and its tests are built for x86_64 on the arm64 runner
  # and run under Rosetta. They need no SDL2, so the frontend is not configured here.
  macos-x86_64-decompiler:
    name: Decompiler engine + tests (macOS x86_64 under Rosetta)
    runs-on: macos-latest
    timeout-minutes: 120
    # One list drives the build, the -R regex and the check that each selected test was built, so the
    # three cannot drift apart (A12-10: Sh2DecodeTests and Sh2GeneratedTests were selected and not built,
    # and ctest ended "Not Run"). Each name is the middle of SaturnExplorer<name>Tests.
    # Not in the list, and not yet tried under Rosetta (A12-38): Sh2PrintedC (a mode of Sh2Generated that compiles with
    # the system C compiler; A12-21's macOS fault was an arm64 address-space fact, so the x86_64 result is not implied and
    # wants its own trial run), DecompilerFault (its default subset takes minutes; the Linux sanitizers job and the arm64
    # job run it), CapturedValueInspection and GenerateSpecDataFailure. Every one of them runs on the arm64 job.
    env:
      SE_ROSETTA_TESTS: SlaFreshness Sh2DecompilerEngine SavestateShape MemorySnapshot Sh2FunctionFinder Sh2Decompiler Sh2Semantics Sh2Decode Sh2Generated Sh2DecompilerFixture DecompilerRunner DecompilerPanel DecompilerModel DecompilerTrust HardwareWidthTable CapturedInspectionMetadata
    defaults:
      run:
        working-directory: SaturnExplorer
    steps:
      - uses: actions/checkout@v4
      - name: Configure (x86_64)
        run: >
          cmake -S . -B build-x86_64 -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON
          -DSE_FAIL_ON_SKIP=ON
      - name: Build decompiler engine (timed)
        run: time cmake --build build-x86_64 --parallel 4 --target SaturnExplorerGhidraDecomp
      - name: Build decompiler tests
        run: |
          targets=""
          for n in $SE_ROSETTA_TESTS; do targets="$targets SaturnExplorer${n}Tests"; done
          echo "Building:$targets"
          cmake --build build-x86_64 --parallel 4 --target $targets
      - name: Verify the binaries are x86_64
        run: |
          lipo -archs build-x86_64/bin/SaturnExplorerSh2DecompilerEngineTests | grep -qx x86_64
          lipo -archs build-x86_64/bin/se-sleighc | grep -qx x86_64
          lipo -archs build-x86_64/bin/SaturnExplorerDecompilerRunnerTests | grep -qx x86_64
          lipo -archs build-x86_64/bin/SaturnExplorerSh2DecodeTests | grep -qx x86_64
          lipo -archs build-x86_64/bin/SaturnExplorerSh2GeneratedTests | grep -qx x86_64
      # Fails, naming the test, when a test the next step selects has no executable (instead of CTest's "Not Run").
      - name: Check that every selected test was built
        run: bash ../.github/scripts/check-selected-tests-built.sh build-x86_64 $SE_ROSETTA_TESTS
      - name: Run the decompiler tests under Rosetta
        run: |
          alt=""
          for n in $SE_ROSETTA_TESTS; do alt="${alt:+$alt|}$n"; done
          ctest --test-dir build-x86_64 --output-on-failure -V -R "SaturnExplorer($alt)Tests"

  # The distributable macOS bundle and DMG, ad-hoc signed (BUILD.md's recipe as written, no
  # identity given). Developer ID signing and notarisation need a certificate and stay a manual,
  # recorded release step. A bundle can pass `codesign --verify` and still not start (library
  # validation, sdl2-compat's run-time load of SDL3), so the bundled binary is also launched with
  # --selftest, with Homebrew's SDL removed so only what the bundle carries can satisfy it.
  macos-bundle-dmg:
    name: macOS bundle + DMG (ad-hoc signed)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: SaturnExplorer
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS frontend dependencies
        run: brew install sdl2
      - name: Configure
        run: >
          cmake -S . -B build-bundle -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DSE_MACOS_BUNDLE_LIBS=ON
      - name: Build
        run: cmake --build build-bundle --parallel 4
      - name: Install the bundle
        run: cmake --install build-bundle --prefix "$PWD/stage"
      - name: Verify the installed bundle
        run: |
          test -d stage/SaturnExplorer.app
          test -x stage/SaturnExplorer.app/Contents/MacOS/SaturnExplorer
          codesign --verify --deep --strict --verbose=2 stage/SaturnExplorer.app
          # Every third-party licence text ships inside the signed bundle.
          for f in ghidra-decompiler/LICENSE ghidra-decompiler/NOTICE zlib/LICENSE nlohmann-json/LICENSE.MIT imgui/LICENSE.txt fonts/LICENSE-IPAfont.txt fonts/LICENSE-Liberation.txt; do
            test -f "stage/SaturnExplorer.app/Contents/Resources/licenses/$f"
          done
          # Self-contained: nothing may still point into Homebrew, from the exe or a bundled dylib.
          # `! cmd | grep` never fails a step under `bash -e` (a negated pipeline is exempt from errexit), so this check
          # passed whatever it found (A12-35). The first line of `otool -L` is the file's own path and is skipped.
          # The listing is taken on its own line so that an otool that fails (a path the glob did not expand, a file it cannot
          # read) stops the step under `bash -e`; inside a pipeline its status was dropped and the file passed unchecked (A12-46).
          checked=0
          for f in stage/SaturnExplorer.app/Contents/MacOS/SaturnExplorer stage/SaturnExplorer.app/Contents/Frameworks/*.dylib; do
            deps="$(otool -L "$f")"
            if printf '%s\n' "$deps" | tail -n +2 | grep -E '/opt/homebrew|/usr/local/'; then
              echo "::error::$f still points into Homebrew"; exit 1
            fi
            checked=$((checked + 1))
          done
          echo "$checked binaries checked for Homebrew references"
          test "$checked" -ge 2   # the executable and at least the bundled SDL
          # sdl2-compat loads SDL3 at run time; the bundle must carry it.
          if strings stage/SaturnExplorer.app/Contents/Frameworks/libSDL2*.dylib | grep -q libSDL3; then
            test -f stage/SaturnExplorer.app/Contents/Frameworks/libSDL3.dylib
          fi
      - name: Package the DMG
        working-directory: SaturnExplorer/build-bundle
        run: cpack -G DragNDrop
      - name: Verify the DMG and the bundle inside it
        working-directory: SaturnExplorer/build-bundle
        run: |
          test -f SaturnExplorer-macos.dmg
          mkdir -p dmg-mount
          hdiutil attach -nobrowse -readonly -mountpoint dmg-mount SaturnExplorer-macos.dmg
          test -d dmg-mount/SaturnExplorer.app
          codesign --verify --deep --strict --verbose=2 dmg-mount/SaturnExplorer.app
          for f in ghidra-decompiler/LICENSE ghidra-decompiler/NOTICE zlib/LICENSE nlohmann-json/LICENSE.MIT imgui/LICENSE.txt fonts/LICENSE-IPAfont.txt fonts/LICENSE-Liberation.txt; do
            test -f "dmg-mount/SaturnExplorer.app/Contents/Resources/licenses/$f"
          done
          hdiutil detach dmg-mount
      # Last, because cpack re-runs fixup_bundle and needs Homebrew's SDL to copy from.
      - name: Launch the bundled binaries without Homebrew's SDL
        working-directory: SaturnExplorer/build-bundle
        run: |
          brew uninstall --ignore-dependencies sdl2 sdl2-compat sdl3 || true
          if ls /opt/homebrew/lib/libSDL* /usr/local/lib/libSDL* 2>/dev/null; then echo "Homebrew SDL still present"; exit 1; fi
          perl -e 'alarm 60; exec @ARGV' ../stage/SaturnExplorer.app/Contents/MacOS/SaturnExplorer --selftest
          hdiutil attach -nobrowse -readonly -mountpoint dmg-mount SaturnExplorer-macos.dmg
          perl -e 'alarm 60; exec @ARGV' dmg-mount/SaturnExplorer.app/Contents/MacOS/SaturnExplorer --selftest
          hdiutil detach dmg-mount
