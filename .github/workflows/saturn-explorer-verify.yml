name: Saturn Explorer Functionality Verification

on:
  push:
    branches: [master]
    paths:
      - 'SaturnExplorer/**'
      - '.github/workflows/saturn-explorer-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Supported platform build + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: SaturnExplorer
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS frontend dependencies
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run CTest
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Verify macOS headless renderer exists
        if: runner.os == 'macOS'
        shell: bash
        run: test -x build/bin/se-render
